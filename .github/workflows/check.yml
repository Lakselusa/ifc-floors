name: Checks

# Runs on proposed changes, so a pull request shows whether it is safe to merge
# before anyone looks at the code. Deployment is a separate workflow and only
# happens once a change reaches main.
on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
