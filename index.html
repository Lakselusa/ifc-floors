<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IFC Floors</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <header class="bar">
        <h1>Floors</h1>
        <button id="heights" class="quiet" type="button" aria-pressed="false" title="Show floor heights">↕</button>
        <button id="refresh" type="button">Scan models</button>
        <button id="diagnose" type="button">Diagnose</button>
      </header>
      <p id="status" class="status">Connecting to Trimble Connect…</p>
      <ul id="levels" class="levels"></ul>
      <textarea id="report" class="report" readonly hidden></textarea>
      <footer class="bar">
        <button id="reset" type="button" title="Clear the selection and show every object again">Reset</button>
        <button id="isolate" type="button" class="primary">Isolate selected</button>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
